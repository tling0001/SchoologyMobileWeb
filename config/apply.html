<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563a6"><title>Open ClassWire configuration</title>
<style>:root{color-scheme:light dark;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:Canvas;color:CanvasText}main{width:min(28rem,calc(100% - 2.5rem));padding:2rem;border:1px solid color-mix(in srgb,CanvasText 16%,transparent);border-radius:1.25rem;background:color-mix(in srgb,Canvas 94%,CanvasText 6%);box-sizing:border-box}h1{font-size:1.45rem;margin:0 0 .5rem}p{color:GrayText}a{display:block;text-align:center;text-decoration:none;border-radius:.75rem;padding:.85rem 1rem;background:#2563a6;color:white;font-weight:650}code{overflow-wrap:anywhere;display:block;margin-top:1rem;font-size:.8rem;color:GrayText}</style></head>
<body><main><h1>Open this configuration in ClassWire</h1><p>This link applies the published sign-in configuration to a ClassWire installation. It does not grant administrator access.</p><a id="open" href="#">Open in ClassWire</a><p id="status" role="status">If ClassWire is installed, choose Open in ClassWire. Otherwise, install the app first and return to this page.</p><code id="fallback"></code></main>
<script>(()=>{const q=new URLSearchParams(location.search),id=q.get("id"),token=q.get("token"),status=document.getElementById("status");if(!id||!token){status.textContent="This configuration link is incomplete. Ask the administrator for a new link.";document.getElementById("open").hidden=true;return;}document.getElementById("open").href="classwire://config/apply?id="+encodeURIComponent(id)+"&token="+encodeURIComponent(token);document.getElementById("fallback").textContent=location.href;document.getElementById("open").addEventListener("click",()=>status.textContent="Opening ClassWire… If nothing happens, make sure the app is installed.");})();</script></body></html>
